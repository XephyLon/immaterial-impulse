# Generated by Matugen from the current wallpaper. Included by kitty.conf.
# Regenerated on every wallpaper change; edits here are overwritten.
#
# Material 3 is a tonal system with only three accent hues (primary/secondary/
# tertiary) plus error, so the 16 ANSI slots are mapped onto tonal roles rather
# than true red/green/blue hues: color1/color9 stay on `error` so apps that use
# ANSI red for failures still read as an alert, the remaining slots cycle the
# accent roles and their fixed/dim variants for tonal variety, and 0/7/8/15 come
# from the surface/on-surface neutrals.

background            {{colors.background.default.hex}}
foreground            {{colors.on_background.default.hex}}

cursor                {{colors.primary.default.hex}}
cursor_text_color     {{colors.on_primary.default.hex}}

selection_background  {{colors.on_secondary_container.default.hex}}
selection_foreground  {{colors.secondary_container.default.hex}}

# Normal
color0                {{colors.surface_container_lowest.default.hex}}
color1                {{colors.error.default.hex}}
color2                {{colors.primary.default.hex}}
color3                {{colors.secondary.default.hex}}
color4                {{colors.tertiary.default.hex}}
color5                {{colors.primary_fixed_dim.default.hex}}
color6                {{colors.secondary_fixed_dim.default.hex}}
color7                {{colors.on_surface_variant.default.hex}}

# Bright
color8                {{colors.surface_variant.default.hex}}
color9                {{colors.error.default.hex}}
color10               {{colors.primary_fixed.default.hex}}
color11               {{colors.secondary_fixed.default.hex}}
color12               {{colors.tertiary_fixed.default.hex}}
color13               {{colors.primary.default.hex}}
color14               {{colors.tertiary_fixed_dim.default.hex}}
color15               {{colors.on_surface.default.hex}}
