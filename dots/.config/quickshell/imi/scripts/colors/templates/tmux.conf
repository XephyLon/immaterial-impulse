# Generated by Matugen. Changes are overwritten on palette updates.
#
# Colors AND the status-line shapes live here so both follow the palette; the
# static ~/.config/tmux/tmux.conf holds behavior only and sources this file.
# The status bar background stays `default` (the terminal's own themed
# background), so the rounded segments render as floating Material pills.
# The half-circle caps are Nerd Font glyphs (U+E0B6 / U+E0B4); the suite's
# terminal font (JetBrains Mono Nerd Font) ships them.
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 40
set -g status-style "bg=default,fg={{colors.on_surface.default.hex}}"
set -g status-left "#[fg={{colors.primary_container.default.hex}},bg=default]#[fg={{colors.on_primary_container.default.hex}},bg={{colors.primary_container.default.hex}},bold] #S #[fg={{colors.primary_container.default.hex}},bg=default] "
set -g status-right "#[fg={{colors.secondary_container.default.hex}},bg=default]#[fg={{colors.on_secondary_container.default.hex}},bg={{colors.secondary_container.default.hex}}] %H:%M #[fg={{colors.secondary_container.default.hex}},bg=default]"
setw -g window-status-separator " "
setw -g window-status-format "#[fg={{colors.surface_container_high.default.hex}},bg=default]#[fg={{colors.on_surface_variant.default.hex}},bg={{colors.surface_container_high.default.hex}}]#I #W#[fg={{colors.surface_container_high.default.hex}},bg=default]"
setw -g window-status-current-format "#[fg={{colors.primary.default.hex}},bg=default]#[fg={{colors.on_primary.default.hex}},bg={{colors.primary.default.hex}},bold]#I #W#[fg={{colors.primary.default.hex}},bg=default]"
setw -g window-status-activity-style "bg={{colors.tertiary_container.default.hex}},fg={{colors.on_tertiary_container.default.hex}},bold"
set -g message-style "bg={{colors.primary_container.default.hex}},fg={{colors.on_primary_container.default.hex}}"
set -g message-command-style "bg={{colors.secondary_container.default.hex}},fg={{colors.on_secondary_container.default.hex}}"
set -g pane-border-style "fg={{colors.outline_variant.default.hex}}"
set -g pane-active-border-style "fg={{colors.primary.default.hex}}"
set -g mode-style "bg={{colors.tertiary.default.hex}},fg={{colors.on_tertiary.default.hex}},bold"
set -g clock-mode-colour "{{colors.primary.default.hex}}"
