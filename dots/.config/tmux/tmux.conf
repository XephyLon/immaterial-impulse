# Immaterial Impulse tmux configuration. Behavior only - colors and the
# Material status line (pill shapes) live in matugen.conf, regenerated from the
# active palette on every wallpaper/color switch (template:
# quickshell/imi/scripts/colors/templates/tmux.conf).

# fish is the suite's shell; fall back to the login shell where it is missing.
if-shell 'command -v fish' 'set -g default-command fish'

set -sa terminal-overrides ',xterm*:Tc'
set -g mouse on
set -g history-limit 50000

# C-Space prefix (C-b is the worst chord in the row)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Windows and panes are 1-based, and renumber when one closes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Vim-style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt-arrows switch panes without the prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift-arrows / Shift-Alt-vim switch windows
bind -n S-Left previous-window
bind -n S-Right next-window
bind -n M-H previous-window
bind -n M-L next-window

# Splits keep the current pane's directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# vi copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Plugins, managed by tpm when it is installed
# (git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm,
# then prefix + I). Without tpm these lines are inert options, not errors.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

# Matugen colors + Material pill status line
source-file -q ~/.config/tmux/matugen.conf

if-shell 'test -x ~/.config/tmux/plugins/tpm/tpm' 'run ~/.config/tmux/plugins/tpm/tpm'
