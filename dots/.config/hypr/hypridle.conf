$lock_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lock")' & pidof qs quickshell hyprlock || hyprlock
# $lock_cmd = pidof hyprlock || hyprlock
$suspend_cmd = systemctl suspend || loginctl suspend

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lockFocus")'
    inhibit_sleep = 3
}

# OLED screensaver (quickshell). Keep timeout in sync with Config.options.screensaver.timeout.
# Must fire BEFORE the lock listener below (240 < 300) or lock supersedes it.
# show() no-ops unless screensaver.enable is true, so this listener is safe to leave in place.
listener {
    timeout = 240 # 4mins (before lock at 5mins)
    on-timeout = qs -c ii ipc call screensaver show
    on-resume = qs -c ii ipc call screensaver hide
}

listener {
    timeout = 300 # 5mins
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600 # 10mins
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 900 # 15mins
    on-timeout = $suspend_cmd
}
